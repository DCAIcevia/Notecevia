# cargo-deny 配置；检查项由 .github/workflows/audit.yml 指定。

[advisories]
# 传递依赖里的 unmaintained 不报错，只对工作区直接依赖报错。
unmaintained = "workspace"
yanked = "warn"

[licenses]
# 允许列表按当前依赖图设定；依赖带来列表外的许可证时审计失败，需要单独确认后再加。
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
# 依赖只允许来自 crates.io。
unknown-registry = "deny"
unknown-git = "deny"
