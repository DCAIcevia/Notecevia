# cargo-deny 配置；检查项由 .github/workflows/audit.yml 与 ci.yml 指定。

[advisories]
# 传递依赖的 unmaintained 也报错；当前无法自行修复的上游项逐条记在 ignore 里。
unmaintained = "all"
# 锁文件里出现被 yank 的版本即失败。
yanked = "deny"
# 上游升级后如果某条 advisory 不再命中，cargo-deny 会以 advisory-not-detected 告警，据此清理本列表。
ignore = [
  # proc-macro-error 1.0.4：glib-macros 0.18 的构建期依赖，只有 Linux 的 GTK 栈用，二进制不链入；gtk-rs 还没换掉。
  "RUSTSEC-2024-0370",
  # zvariant 5.15.1：tauri-plugin-opener 在 Linux 上经 zbus 拉入，等上游升级后删除。
  "RUSTSEC-2026-0370",
  # zbus_names 4.3.5：同上。
  "RUSTSEC-2026-0371",
  # zvariant_derive 5.15.1：同上。
  "RUSTSEC-2026-0372",
]

[licenses]
# 允许列表按当前依赖图设定；依赖带来列表外的许可证时审计失败，需要单独确认后再加。
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  # Tauri 的 HTML/CSS 解析栈（cssparser、selectors、dom_query）与 option-ext 是 MPL-2.0：
  # 文件级弱 copyleft，作为依赖分发，对应源码可从 crates.io 取回。
  "MPL-2.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# 注册表依赖不得写通配符版本；workspace 内部 crate 的 path 依赖不带 version 是正常写法，放行。
wildcards = "deny"
allow-wildcard-paths = true
# 已知重复版本来自 tauri/gtk 上游，本仓库无法消除，只告警不失败。
multiple-versions = "warn"

[sources]
# 依赖只允许来自 crates.io。
unknown-registry = "deny"
unknown-git = "deny"
