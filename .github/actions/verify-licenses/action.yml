name: Verify third-party licenses
description: 按锁定的依赖图重新生成 THIRD_PARTY_LICENSES.md，与仓库内版本不一致时失败。

runs:
  using: composite
  steps:
    - name: Cache cargo-about
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/bin/cargo-about
          ~/.cargo/bin/cargo-about.exe
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
        key: ${{ runner.os }}-cargo-about-0.9.2
    - name: Install cargo-about
      shell: pwsh
      run: |
        # 版本与 CONTRIBUTING 记录的生成命令一致；升级 cargo-about 时两处一起改。
        if (-not (Get-Command cargo-about -ErrorAction SilentlyContinue)) {
          cargo install cargo-about --version 0.9.2 --locked --features cli
        }
    - name: Regenerate and compare
      shell: pwsh
      run: |
        cargo about generate --locked about.hbs --output-file THIRD_PARTY_LICENSES.md
        if (git status --porcelain -- THIRD_PARTY_LICENSES.md) {
          throw "THIRD_PARTY_LICENSES.md is stale; regenerate it from the current Cargo.lock and commit the result"
        }
