name: Audit

# 每周做一次完整审计；依赖相关文件变化时只校验许可证清单是否与依赖图一致。
on:
  schedule:
    - cron: "30 3 * * 1"
  push:
    branches: [main]
    paths: &dependency-paths
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "deny.toml"
      - "about.toml"
      - "about.hbs"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/actions/verify-licenses/**"
      - ".github/workflows/audit.yml"
  pull_request:
    paths: *dependency-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    name: Advisory audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # 已知漏洞、许可证与依赖来源。
          command: check advisories licenses sources

  licenses:
    name: Third-party licenses
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        # rustup 代理按 rust-toolchain.toml 安装固定版本与组件。
        run: rustup show
      - name: Verify third-party licenses
        uses: ./.github/actions/verify-licenses
