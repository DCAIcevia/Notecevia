name: Release

on:
  push:
    tags: ["v*"]
  # 手动干跑：不建 Release，只走版本校验与三平台构建，用来在打标签之前试探流程。
  workflow_dispatch:
    inputs:
      version:
        description: 干跑的版本号，例如 0.2.0-alpha.3
        required: true
        type: string

run-name: ${{ github.event_name == 'workflow_dispatch' && 'Release dry run' || 'Release' }} ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 推标签时用标签名，干跑时用输入的版本；两处都在校验步骤里归一成不带 v 的版本号。
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  verify:
    name: Verify release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Verify tag is on main
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag commit $env:GITHUB_SHA is not reachable from main"
          }
      - name: Set up Rust toolchain
        # rustup 代理按 rust-toolchain.toml 安装固定版本与组件。
        run: rustup show
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-verify
      - name: Verify version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 版本只认 Cargo.toml 的 [workspace.package] version。
          # 标签与版本不一致时标签已经不可删改（ruleset 保护），只能作废重发，所以这里必须硬失败。
          $expected = $env:RELEASE_VERSION
          if ($expected.StartsWith('v')) { $expected = $expected.Substring(1) }
          # 取版本用 cargo pkgid，不用 cargo metadata：pkgid 输出是纯 ASCII 的一行，
          # 不受 PowerShell 本机编码影响（metadata 的 JSON 里有中文描述，解析会随机器编码崩掉）。
          $pkgid = cargo pkgid -p notecevia --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo pkgid 失败：$pkgid" }
          if ($pkgid -notmatch '@([^@]+)$') { throw "无法从 cargo pkgid 输出里取出版本：$pkgid" }
          $cargoVersion = $Matches[1]
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $cargoVersion) {
            throw "package.json 版本 $pkgVersion 与 Cargo 版本 $cargoVersion 不一致；两处一起改"
          }
          $tauriConfig = Get-Content crates/app/tauri.conf.json -Raw | ConvertFrom-Json
          if ($tauriConfig.PSObject.Properties.Name -contains 'version') {
            throw 'tauri.conf.json 不要写 version：安装包版本统一取自 Cargo.toml，写死会与标签漂移'
          }
          if ($cargoVersion -ne $expected) {
            throw "版本 $expected 与 workspace 版本 $cargoVersion 不一致：先改 Cargo.toml 的 [workspace.package] version 再打标签"
          }
          Write-Output "Version verified: $cargoVersion"
      - name: Verify third-party licenses
        uses: ./.github/actions/verify-licenses
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            bundles: deb,appimage
            prerelease_bundles: deb,appimage
          - name: windows
            os: windows-latest
            bundles: msi,nsis
            # MSI 的版本段只接受纯数字（WiX 限制），带 -alpha 之类后缀的版本只能出 NSIS。
            prerelease_bundles: nsis
          - name: macos
            os: macos-latest
            bundles: dmg
            prerelease_bundles: dmg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Set up Rust toolchain
        # rustup 代理按 rust-toolchain.toml 安装固定版本与组件。
        run: rustup show
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 窗口壳（crates/app，Tauri）在根 workspace 里，Gate 需要 WebKit 与 GTK 开发包。
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            librsvg2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.name }}
      - name: Install pnpm
        # 安装包要内嵌前端资源：装好前端依赖后由 tauri build 跑 beforeBuildCommand 生成 dist。
        run: npm install --global pnpm@12.8.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installers
        # bundles 必须整段加引号：pwsh 会把 msi,nsis 折成一个带空格的参数，Tauri 直接拒绝。
        run: pnpm tauri build --bundles "${{ contains(env.RELEASE_VERSION, '-') && matrix.prerelease_bundles || matrix.bundles }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 安装包单独收进 artifacts/：dist/ 是前端构建产物，混在一起会被当成发布资产传上去。
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # 预发布版本只有 NSIS，稳定版本还有 MSI；按实际产出的目录收，缺一种不算错，全缺才算错。
          $copied = 0
          foreach ($pattern in @('target/release/bundle/msi/*.msi', 'target/release/bundle/nsis/*.exe')) {
            $files = @(Get-ChildItem $pattern -ErrorAction SilentlyContinue)
            if ($files.Count -gt 0) {
              $files | Copy-Item -Destination artifacts/
              $copied += $files.Count
            }
          }
          if ($copied -eq 0) { throw '没有找到任何安装包：检查 bundles 与 tauri build 的输出目录' }
          Get-ChildItem artifacts -File | Select-Object Name, Length
      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "${{ matrix.name }}" in
            linux)
              cp target/release/bundle/deb/*.deb artifacts/
              cp target/release/bundle/appimage/*.AppImage artifacts/
              ;;
            macos)
              cp target/release/bundle/dmg/*.dmg artifacts/
              ;;
          esac
          ls -l artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notecevia-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # 干跑只验证与构建，不产出 Release。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Add license copies
        shell: bash
        run: |
          set -euo pipefail
          # 分发产物须附许可证副本与署名，见 LICENSE 第 4 条与 NOTICE。只在发布阶段放一次，避免各平台同名文件互相覆盖。
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md dist/
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/notecevia-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # 校验和覆盖合并后的全部资产。放在各平台生成会同名互相覆盖，最后只剩一个平台的清单。
          files=()
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "SHA256SUMS" ] && continue
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有可校验的发布资产" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
          show-summary: true
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*
          sbom-path: dist/notecevia-${{ github.ref_name }}-sbom.spdx.json
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # 仓库开启了 immutable releases：先建草稿并上传资产，发布后再上传会被拒绝。
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
