name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is on main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag commit $env:GITHUB_SHA is not reachable from main"
          }
      - name: Set up Rust toolchain
        # rustup 代理按 rust-toolchain.toml 安装固定版本与组件。
        run: rustup show
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-verify
      - name: Verify version
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --locked --no-deps | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "notecevia" }).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match notecevia version $version"
          }
          Write-Output "Tag matches version: $version"
      - name: Verify third-party licenses
        uses: ./.github/actions/verify-licenses
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            bundles: deb,appimage
          - name: windows
            os: windows-latest
            bundles: msi,nsis
          - name: macos
            os: macos-latest
            bundles: dmg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        # rustup 代理按 rust-toolchain.toml 安装固定版本与组件。
        run: rustup show
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 窗口壳（crates/app，Tauri）在根 workspace 里，Gate 需要 WebKit 与 GTK 开发包。
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            librsvg2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.name }}
      - name: Install pnpm
        # 安装包要内嵌前端资源：装好前端依赖后由 tauri build 跑 beforeBuildCommand 生成 dist。
        run: npm install --global pnpm@12.8.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installers
        # tauri build 自带 custom-protocol 资源内嵌与 release 配置，--bundles 按平台出安装包。
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/bundle/msi/*.msi dist/
          Copy-Item target/release/bundle/nsis/*.exe dist/
          # 分发产物须附许可证副本与署名，见 LICENSE 第 4 条与 NOTICE。
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_LICENSES.md dist/
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Path dist/SHA256SUMS -Encoding ascii
      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            linux)
              cp target/release/bundle/deb/*.deb dist/
              cp target/release/bundle/appimage/*.AppImage dist/
              ;;
            macos)
              cp target/release/bundle/dmg/*.dmg dist/
              ;;
          esac
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md dist/
          (cd dist && for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS" ]; then
              if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f"; else shasum -a 256 "$f"; fi
            fi
          done > SHA256SUMS)
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notecevia-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/notecevia-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
          show-summary: true
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*
          sbom-path: dist/notecevia-${{ github.ref_name }}-sbom.spdx.json
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # 仓库开启了 immutable releases：先建草稿并上传资产，发布后再上传会被拒绝。
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false