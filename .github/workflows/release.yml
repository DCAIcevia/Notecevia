name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: 构建与发布
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 工具链
        # rustup 代理按 rust-toolchain.toml 安装固定版本与组件。
        run: cargo --version
      - name: 编译缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
      - name: 校验版本
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --locked --no-deps | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "notecevia-app" }).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "标签 $env:GITHUB_REF_NAME 与 notecevia-app 版本 $version 不一致"
          }
          Write-Output "标签与版本一致：$version"
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: 构建
        run: cargo build --release -p notecevia-app --locked
      - name: 打包
        shell: pwsh
        run: |
          $zip = "notecevia-$env:GITHUB_REF_NAME-windows.zip"
          Compress-Archive -Path target/release/notecevia.exe -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
      - name: 发布
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            notecevia-${{ github.ref_name }}-windows.zip
            notecevia-${{ github.ref_name }}-windows.zip.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
