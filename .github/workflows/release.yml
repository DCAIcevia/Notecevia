name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        # rustup 代理按 rust-toolchain.toml 安装固定版本与组件。
        run: rustup show
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
      - name: Verify version
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --locked --no-deps | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "notecevia-app" }).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match notecevia-app version $version"
          }
          Write-Output "Tag matches version: $version"
      - name: Verify third-party licenses
        uses: ./.github/actions/verify-licenses
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --release -p notecevia-app --locked
      - name: Package
        shell: pwsh
        run: |
          $zip = "notecevia-$env:GITHUB_REF_NAME-windows.zip"
          # 分发二进制须附许可证副本与署名，见 LICENSE 第 4 条与 NOTICE。
          $files = @("target/release/notecevia.exe", "LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md")
          Compress-Archive -Path $files -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            notecevia-${{ github.ref_name }}-windows.zip
            notecevia-${{ github.ref_name }}-windows.zip.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
