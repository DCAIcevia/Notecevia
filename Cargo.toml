[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/ui", "crates/app"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
egui = "0.37"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
fontique = "0.12"
