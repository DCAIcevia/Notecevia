[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/ui", "crates/app"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
# 应用不发布到 crates.io；工作区 crate 因此在第三方许可清单里按私有 crate 排除。
publish = false

[workspace.dependencies]
egui = "0.37"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
# egui 的系统字体提供者已为 yeslogic-fontconfig-sys 打开 dlopen，两个 fontique 版本共用这一个 sys crate，
# 特性必须一致，否则 Linux 上 fontique 0.12 找不到 fontconfig 符号。
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }
