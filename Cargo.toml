[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/app",
]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
# 应用不发布到 crates.io；工作区 crate 因此在第三方许可清单里按私有 crate 排除。
publish = false

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Tauri 官方的产物配置：只能写在 workspace 根，成员包里的 [profile] 会被忽略。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
